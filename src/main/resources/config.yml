prefix: "&#0055ff&l⚡ &#00E5FF&lMIR-TIME &8» "

security:
  # Название пустого мира для зависания в воздухе до входа:
  auth-world: "auth_void"
  # Включить графическую капчу на карте:
  captcha-enabled: true
  min-password-length: 6
  max-password-length: 32
  # Время запоминания IP-сессии в часах (0 - спрашивать пароль каждый вход):
  session-hours: 12
  # Время на прохождение капчи и входа в секундах до кика:
  login-timeout-seconds: 90
  allowed-commands:
    - "/login"
    - "/l"
    - "/register"
    - "/reg"
    - "/2fa"
