  smtp-host: "smtp.yandex.ru"
  smtp-port: 465
  username: "mirtime-server@yandex.ru"
  password: "пароль_приложения"

lobby-clock:
  enabled: true
  slot: 8
  name: "&#0055ff&l⚡ &#00E5FF&lМеню сервера &7(ПКМ)"
